<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgView" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090F1C" />
      <stop offset="100%" stop-color="#050812" />
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#bgView)" />

  <rect x="40" y="30" width="920" height="540" rx="14" fill="#0D1424" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  
  <!-- Header -->
  <rect x="40" y="30" width="920" height="45" rx="14" fill="#131D33" />
  <circle cx="65" cy="52" r="5" fill="#EF4444" />
  <circle cx="85" cy="52" r="5" fill="#F59E0B" />
  <circle cx="105" cy="52" r="5" fill="#10B981" />
  <text x="135" y="57" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">
    IPARRS Compliance Risk Auditor — Master Dashboard
  </text>

  <!-- Left: Flagged Clauses List -->
  <rect x="60" y="95" width="300" height="450" rx="8" fill="#0A0F1D" stroke="rgba(255,255,255,0.05)" />
  <text x="80" y="125" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#34D399">
    FLAGGED VIOLATIONS (3)
  </text>

  <!-- Card 1: Critical -->
  <g transform="translate(75, 145)">
    <rect width="270" height="90" rx="6" fill="#1A1828" stroke="#EF4444" stroke-width="1" />
    <rect x="15" y="15" width="60" height="18" rx="4" fill="#EF4444" fill-opacity="0.2" />
    <text x="25" y="28" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F87171">CRITICAL</text>
    <text x="15" y="50" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Clause 14.2: Data Subprocessors</text>
    <text x="15" y="68" font-family="sans-serif" font-size="9" fill="#94A3B8">GDPR Art. 28(2) Prior consent missing</text>
  </g>

  <!-- Card 2: Medium -->
  <g transform="translate(75, 250)">
    <rect width="270" height="90" rx="6" fill="#171F2C" stroke="#F59E0B" stroke-width="1" />
    <rect x="15" y="15" width="60" height="18" rx="4" fill="#F59E0B" fill-opacity="0.2" />
    <text x="25" y="28" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FBBF24">MEDIUM</text>
    <text x="15" y="50" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Clause 8.1: Incident SLA</text>
    <text x="15" y="68" font-family="sans-serif" font-size="9" fill="#94A3B8">72hr breach window vague</text>
  </g>

  <!-- Card 3: Low -->
  <g transform="translate(75, 355)">
    <rect width="270" height="90" rx="6" fill="#141E2D" stroke="#06B6D4" stroke-width="1" />
    <rect x="15" y="15" width="50" height="18" rx="4" fill="#06B6D4" fill-opacity="0.2" />
    <text x="25" y="28" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8">LOW</text>
    <text x="15" y="50" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Clause 22: Governing Law</text>
    <text x="15" y="68" font-family="sans-serif" font-size="9" fill="#94A3B8">Jurisdiction alignment recommendation</text>
  </g>

  <!-- Right: Detailed Evidence & Re-Ranking View -->
  <rect x="380" y="95" width="560" height="450" rx="8" fill="#0A0F1D" stroke="rgba(255,255,255,0.05)" />
  <text x="405" y="125" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">
    Evidence Inspection &amp; Regulatory Cross-Reference
  </text>

  <rect x="405" y="145" width="510" height="110" rx="6" fill="#131B2E" stroke="rgba(255,255,255,0.08)" />
  <text x="420" y="170" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8">EXTRACTED VERBATIM CONTRACT TEXT (Page 142)</text>
  <text x="420" y="195" font-family="sans-serif" font-size="11" fill="#E2E8F0">"The Vendor may appoint tertiary cloud contractors at its sole discretion without written notification..."</text>
  <text x="420" y="235" font-family="'JetBrains Mono', monospace" font-size="9" fill="#EF4444">⚠ DIRECT NON-COMPLIANCE DETECTED (Cosine Score: 0.942)</text>

  <rect x="405" y="275" width="510" height="130" rx="6" fill="#131B2E" stroke="rgba(255,255,255,0.08)" />
  <text x="420" y="300" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399">REGULATORY STATUTE (GDPR Article 28, Clause 2)</text>
  <text x="420" y="325" font-family="sans-serif" font-size="11" fill="#E2E8F0">"The processor shall not engage another processor without prior specific or general written authorization..."</text>
  <text x="420" y="365" font-family="sans-serif" font-size="10" fill="#94A3B8">Recommendation: Require 30-day prior written notice with right-to-object clause insertion.</text>

  <!-- Auditor CTA Action -->
  <rect x="405" y="425" width="180" height="40" rx="6" fill="#10B981" />
  <text x="440" y="450" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#000000">Generate Redline PDF</text>

  <rect x="600" y="425" width="180" height="40" rx="6" fill="#1C273E" stroke="rgba(255,255,255,0.1)" />
  <text x="640" y="450" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Dismiss Flag</text>
</svg>
