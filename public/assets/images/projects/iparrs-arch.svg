    <text x="25" y="102" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8">Top 50 -> Top 8 Filter</text>

    <rect x="15" y="125" width="150" height="60" rx="6" fill="#1C2438" />
    <text x="25" y="145" font-family="sans-serif" font-size="10" font-weight="600" fill="#22D3EE">Self-Reflection Loop</text>
    <text x="25" y="162" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8">LangChain Agent</text>
    <text x="25" y="175" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8">Check False Positives</text>
  </g>

  <!-- Stage 4: Risk Report & Dashboard -->
  <g transform="translate(750, 170)">
