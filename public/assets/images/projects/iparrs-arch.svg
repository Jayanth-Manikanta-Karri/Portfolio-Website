    <text x="15" y="48" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8">Dual-Channel Candidate Gen</text>

    <rect x="15" y="65" width="150" height="55" rx="6" fill="#1A2942" />
    <text x="25" y="85" font-family="sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Dense Semantic</text>
    <text x="25" y="105" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8">FAISS (BGE-Large)</text>

    <rect x="15" y="130" width="150" height="55" rx="6" fill="#1A2942" />
    <text x="25" y="150" font-family="sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Sparse Lexical</text>
    <text x="25" y="170" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FBBF24">BM25 (Exact Articles)</text>

    <text x="15" y="205" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">+20% Retrieval Precision</text>
  </g>

