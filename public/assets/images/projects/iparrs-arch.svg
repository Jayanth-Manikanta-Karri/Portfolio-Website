  </text>

  <!-- Flow connecting paths -->
  <path d="M 180 250 L 250 250" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M 430 250 L 500 250" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M 680 250 L 750 250" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Stage 1: Document Processing -->
  <g transform="translate(60, 170)">
    <rect width="120" height="180" rx="10" fill="#111827" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    <rect width="120" height="4" rx="2" fill="#10B981" />
    <text x="15" y="30" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Ingestion</text>
    <text x="15" y="55" font-family="sans-serif" font-size="9" fill="#94A3B8">• 500+ Page PDF</text>
    <text x="15" y="75" font-family="sans-serif" font-size="9" fill="#94A3B8">• Clause Splitting</text>
    <text x="15" y="95" font-family="sans-serif" font-size="9" fill="#94A3B8">• Hierarchy Trees</text>
    <text x="15" y="115" font-family="sans-serif" font-size="9" fill="#94A3B8">• Meta Tagging</text>
    <rect x="10" y="145" width="100" height="20" rx="4" fill="#10B981" fill-opacity="0.1" />
    <text x="18" y="158" font-family="'JetBrains Mono', monospace" font-size="8" fill="#34D399">OCR + PyMuPDF</text>
  </g>

  <!-- Stage 2: Hybrid Indexing -->
  <g transform="translate(250, 150)">
