  <text x="90" y="500" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34D399">✓ 60% Effort Reduction</text>
  <text x="350" y="500" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8">✓ 99.4% Verifiable Citations</text>
  <text x="650" y="500" font-family="'JetBrains Mono', monospace" font-size="12" fill="#A78BFA">✓ Zero Cloud Egress Leakage</text>
