    <text x="15" y="30" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#34D399">Output Dossier</text>
    <text x="15" y="55" font-family="sans-serif" font-size="9" fill="#94A3B8">• Severity Heatmap</text>
    <text x="15" y="75" font-family="sans-serif" font-size="9" fill="#94A3B8">• Verbatim Quotes</text>
    <text x="15" y="95" font-family="sans-serif" font-size="9" fill="#94A3B8">• Regulatory Links</text>
    <text x="15" y="115" font-family="sans-serif" font-size="9" fill="#94A3B8">• Audit Export</text>
