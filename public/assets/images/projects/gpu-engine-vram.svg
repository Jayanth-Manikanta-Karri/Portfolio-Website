<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="vramBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#vramBg)" />

  <text x="60" y="60" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">
    VRAM ALLOCATION &amp; QUANTIZATION PROFILING (Ada RTX 6000 48GB)
  </text>
  <text x="60" y="85" font-family="'JetBrains Mono', monospace" font-size="12" fill="#22D3EE">
    Standard FP16 Weights vs AWQ 4-bit Quantization Memory Footprint
  </text>

  <!-- Left: Unquantized Scenario (Out of Memory) -->
  <g transform="translate(60, 130)">
    <rect width="410" height="380" rx="12" fill="#111827" stroke="#EF4444" stroke-width="1.5" />
    <text x="25" y="40" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#EF4444">
      Standard FP16 Serving (Failure)
    </text>
    <text x="25" y="65" font-family="sans-serif" font-size="11" fill="#94A3B8">
      Total Required: 72 GB VRAM &gt; 48 GB Physical Limit
    </text>

    <!-- Stack bar -->
    <rect x="25" y="90" width="360" height="40" rx="6" fill="#F87171" />
    <text x="40" y="115" font-family="sans-serif" font-size="11" font-weight="600" fill="#000000">SDXL &amp; FLUX.1: 34 GB</text>

    <rect x="25" y="140" width="360" height="35" rx="6" fill="#F87171" fill-opacity="0.8" />
    <text x="40" y="162" font-family="sans-serif" font-size="11" font-weight="600" fill="#000000">LLaMA 3.1 8B FP16: 16 GB</text>

    <rect x="25" y="185" width="360" height="35" rx="6" fill="#F87171" fill-opacity="0.6" />
    <text x="40" y="207" font-family="sans-serif" font-size="11" font-weight="600" fill="#000000">Mistral + Qwen: 22 GB</text>

    <rect x="25" y="240" width="360" height="50" rx="6" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1" />
    <text x="40" y="270" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#EF4444">
      ❌ CUDA OUT OF MEMORY ERROR
    </text>

    <text x="25" y="325" font-family="sans-serif" font-size="11" fill="#94A3B8">
      Forces constant model disk reload loops (20-30s downtime per swap).
    </text>
  </g>

  <!-- Right: Optimized AWQ + CPU Offloading -->
  <g transform="translate(530, 130)">
    <rect width="410" height="380" rx="12" fill="#111D30" stroke="#10B981" stroke-width="2" />
    <text x="25" y="40" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#34D399">
      AWQ 4-Bit + CPU Offloading (Production)
    </text>
    <text x="25" y="65" font-family="sans-serif" font-size="11" fill="#94A3B8">
      Active VRAM: 35.6 GB / 48 GB (25% Headroom Available)
    </text>

    <!-- Stack bar -->
    <rect x="25" y="90" width="360" height="40" rx="6" fill="#06B6D4" />
    <text x="40" y="115" font-family="sans-serif" font-size="11" font-weight="600" fill="#000000">SDXL / FLUX (Offload Layers): 22 GB</text>

    <rect x="25" y="140" width="360" height="28" rx="6" fill="#10B981" />
    <text x="40" y="159" font-family="sans-serif" font-size="11" font-weight="600" fill="#000000">LLaMA 3.1 8B (AWQ 4-bit): 5.2 GB</text>

    <rect x="25" y="178" width="360" height="28" rx="6" fill="#8B5CF6" />
    <text x="40" y="197" font-family="sans-serif" font-size="11" font-weight="600" fill="#000000">Mistral + Qwen (GPTQ 4-bit): 8.4 GB</text>

    <rect x="25" y="216" width="360" height="24" rx="6" fill="#1E293B" stroke="rgba(255,255,255,0.2)" stroke-dasharray="3 3" />
    <text x="40" y="233" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Free Headroom (KV Cache): 12.4 GB</text>

    <rect x="25" y="260" width="360" height="50" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1" />
    <text x="40" y="290" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#34D399">
      ✓ ZERO-COLD-START MULTI-SERVING
    </text>

    <text x="25" y="340" font-family="sans-serif" font-size="11" fill="#94A3B8">
      35% faster token generation with zero measurable accuracy degradation.
    </text>
  </g>

  <!-- Bottom stat -->
  <rect x="60" y="530" width="880" height="40" rx="8" fill="#0D1322" />
  <text x="80" y="555" font-family="'JetBrains Mono', monospace" font-size="11" fill="#22D3EE">
    Validated with NVIDIA NVML Telemetry &amp; Pydantic SLA Monitors
  </text>
</svg>
