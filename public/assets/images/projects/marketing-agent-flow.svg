<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D16" />
      <stop offset="50%" stop-color="#0F1424" />
      <stop offset="100%" stop-color="#080B12" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="1000" y2="100" />
    <line x1="0" y1="200" x2="1000" y2="200" />
    <line x1="0" y1="300" x2="1000" y2="300" />
    <line x1="0" y1="400" x2="1000" y2="400" />
    <line x1="0" y1="500" x2="1000" y2="500" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="800" y1="0" x2="800" y2="600" />
  </g>

  <!-- Title Header -->
  <text x="60" y="60" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">
    AUTONOMOUS AI MARKETING AGENT — MULTI-AGENT ARCHITECTURE
  </text>
  <text x="60" y="85" font-family="'JetBrains Mono', monospace" font-size="12" fill="#22D3EE">
    CrewAI • SDXL / FLUX • LLaMA 3.1 • Hybrid GPU Cloud Burst
  </text>

  <!-- Flow connecting lines -->
  <path d="M 190 280 L 260 280" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M 440 280 L 510 280" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M 690 280 L 760 280" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4 4" />

  <path d="M 600 220 L 600 160 L 760 160" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M 600 340 L 600 400 L 760 400" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Node 1: Input Ingestion -->
  <g transform="translate(60, 210)">
    <rect width="130" height="140" rx="12" fill="#131B2E" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    <rect width="130" height="4" rx="2" fill="#06B6D4" />
    <text x="15" y="35" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Campaign Brief</text>
    <text x="15" y="60" font-family="sans-serif" font-size="10" fill="#94A3B8">• Goal &amp; Audience</text>
    <text x="15" y="80" font-family="sans-serif" font-size="10" fill="#94A3B8">• Brand Voice PDF</text>
    <text x="15" y="100" font-family="sans-serif" font-size="10" fill="#94A3B8">• Target Channels</text>
    <rect x="15" y="115" width="100" height="15" rx="3" fill="#06B6D4" fill-opacity="0.15" />
    <text x="25" y="126" font-family="'JetBrains Mono', monospace" font-size="8" fill="#22D3EE">JSON / PDF Parser</text>
  </g>

  <!-- Node 2: CrewAI Agent Orchestrator -->
  <g transform="translate(260, 180)">
    <rect width="180" height="200" rx="12" fill="#141C30" stroke="#06B6D4" stroke-width="2" filter="url(#glow)" />
    <text x="20" y="35" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#22D3EE">CrewAI Master Loop</text>
    <text x="20" y="55" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">Stateful Sequential Flow</text>
    
    <g transform="translate(15, 70)">
      <rect width="150" height="25" rx="4" fill="#1A253D" />
      <text x="10" y="17" font-family="sans-serif" font-size="10" fill="#E2E8F0">1. Creative Director Agent</text>
    </g>
    <g transform="translate(15, 102)">
      <rect width="150" height="25" rx="4" fill="#1A253D" />
      <text x="10" y="17" font-family="sans-serif" font-size="10" fill="#E2E8F0">2. Copywriter Agent (LLaMA)</text>
    </g>
    <g transform="translate(15, 134)">
      <rect width="150" height="25" rx="4" fill="#1A253D" />
      <text x="10" y="17" font-family="sans-serif" font-size="10" fill="#E2E8F0">3. Visual Artist (Diffusion)</text>
    </g>
    <g transform="translate(15, 166)">
      <rect width="150" height="25" rx="4" fill="#1A253D" />
      <text x="10" y="17" font-family="sans-serif" font-size="10" fill="#E2E8F0">4. Compliance &amp; Auditor</text>
    </g>
  </g>

  <!-- Node 3: Hybrid Compute Inference Router -->
  <g transform="translate(510, 200)">
    <rect width="180" height="160" rx="12" fill="#161E34" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <text x="20" y="35" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Hybrid Inference Router</text>
    <text x="20" y="55" font-family="'JetBrains Mono', monospace" font-size="9" fill="#A78BFA">FastAPI + Redis Queue</text>

    <rect x="20" y="70" width="140" height="32" rx="6" fill="#06B6D4" fill-opacity="0.1" stroke="#06B6D4" stroke-width="1" />
    <text x="30" y="85" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#22D3EE">Steady State</text>
    <text x="30" y="96" font-family="sans-serif" font-size="9" fill="#94A3B8">On-Prem Ada RTX 6000</text>

    <rect x="20" y="110" width="140" height="32" rx="6" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-width="1" />
    <text x="30" y="125" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#C084FC">Burst Elastic</text>
    <text x="30" y="136" font-family="sans-serif" font-size="9" fill="#94A3B8">AWS EC2 GPU Instances</text>
  </g>

  <!-- Output 1: Generative Visuals -->
  <g transform="translate(760, 110)">
    <rect width="180" height="100" rx="10" fill="#141828" stroke="#8B5CF6" stroke-width="1.5" />
    <text x="15" y="28" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#C084FC">Synthesized Creatives</text>
    <text x="15" y="48" font-family="sans-serif" font-size="10" fill="#94A3B8">• SDXL and FLUX.1 Images</text>
    <text x="15" y="66" font-family="sans-serif" font-size="10" fill="#94A3B8">• Aspect Ratios: 1:1, 9:16</text>
    <text x="15" y="84" font-family="sans-serif" font-size="10" fill="#94A3B8">• Brand Palette Alignment</text>
  </g>

  <!-- Output 2: Copy & Hooks -->
  <g transform="translate(760, 230)">
    <rect width="180" height="100" rx="10" fill="#141828" stroke="#06B6D4" stroke-width="1.5" />
    <text x="15" y="28" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#22D3EE">Optimized Copywriting</text>
    <text x="15" y="48" font-family="sans-serif" font-size="10" fill="#94A3B8">• High-CTR Ad Headlines</text>
    <text x="15" y="66" font-family="sans-serif" font-size="10" fill="#94A3B8">• Multi-Channel Variants</text>
    <text x="15" y="84" font-family="sans-serif" font-size="10" fill="#94A3B8">• Tone Verification Score</text>
  </g>

  <!-- Output 3: Scheduling & Analytics -->
  <g transform="translate(760, 350)">
    <rect width="180" height="100" rx="10" fill="#141828" stroke="#10B981" stroke-width="1.5" />
    <text x="15" y="28" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#34D399">Multi-Channel Publish</text>
    <text x="15" y="48" font-family="sans-serif" font-size="10" fill="#94A3B8">• Automated Queue Timing</text>
    <text x="15" y="66" font-family="sans-serif" font-size="10" fill="#94A3B8">• Next.js Human Approval</text>
    <text x="15" y="84" font-family="sans-serif" font-size="10" fill="#94A3B8">• 80% Touchpoint Cut</text>
  </g>

  <!-- Bottom Metric Callout -->
  <rect x="60" y="490" width="880" height="60" rx="10" fill="#0E1626" stroke="rgba(255,255,255,0.06)" />
  <text x="90" y="525" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10B981">
    ✓ 70% Turnaround Acceleration
  </text>
  <text x="350" y="525" font-family="'JetBrains Mono', monospace" font-size="12" fill="#22D3EE">
    ✓ 80% Fewer Human Interactions
  </text>
  <text x="650" y="525" font-family="'JetBrains Mono', monospace" font-size="12" fill="#C084FC">
    ✓ 62% Compute Cost Optimization
  </text>
</svg>
